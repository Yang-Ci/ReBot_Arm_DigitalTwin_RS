# ROS 2 hardware selection and SDK override config.
#
# sdk_config is loaded from third_party/reBotArm_control_py/config, then the
# selected model's overrides are deep-merged on top. Launch parameter channel
# has highest priority.

default_model: rs

models:
  rs:
    sdk_config: rebotarm_rs.yaml
    overrides:
      name: reBotArm-RS
      urdf_path: urdf/RS/urdf/ReBot_Arm_RS.urdf
      end_effector_frame: gripper_end
      channel: can0
      # One 1 Mbps CAN bus carries seven MIT commands and their feedback.
      # 125 Hz is a sustainable, even cadence; a nominal 500 Hz loop overruns
      # continuously and produces irregular motor command spacing.
      rate: 125
      groups:
        arm:
          joints: [joint1, joint2, joint3, joint4, joint5, joint6]
        gripper:
          joints: [gripper]
      gripper:
        position_limits:
          open: 5.0
          close: 0.0
      control:
        arm_control_mode: mit
        # J1 needs more stiffness than the SDK default to overcome the
        # measured direction-dependent static friction. It remains below the
        # original high-stiffness baseline.
        mit_kp: [80.0, 150.0, 150.0, 50.0, 50.0, 50.0]
        mit_kd: [5.0, 10.0, 10.0, 5.0, 4.0, 4.0]
        # Online joint/TCP stream profile.  Velocity is still supplied by the
        # incoming command; these values bound acceleration and jerk.
        stream_acceleration_limit: 4.0
        stream_jerk_limit: 30.0
        stream_natural_frequency: 8.0
      gravity_compensation:
        kp: 1.5
        kd: 1.0

        # compliant gravity compensation so switching modes has no torque step.
        tau_scale: [1.0, 0.92, 0.98, 1.0, 1.0, 1.0]
        # 0 disables the ROS-side clamp; the motor driver still enforces its
        # own model-specific torque limits.
        torque_limit: 0.0
        # Fade from the stiff hold gains to compliant gains without a sudden
        # loss of stiffness at gravity-compensation startup.
        transition_duration: 0.5
      # Conservative hand-guidance for the 0..5 rad RS gripper. Assistance is
      # zero at rest and near either travel limit, and is hard-clamped in code.
      gripper_assist:
        torque: 0.04
        kd: 0.001
        velocity_threshold: 0.02
        velocity_full: 0.22
        speed_limit: 0.8
        breakaway_fraction: 0.30
